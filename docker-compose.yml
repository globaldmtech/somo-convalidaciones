services:
  app:
    container_name: somo-convalidaciones
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    volumes:
      - ./backend/scripts/db.sqlite:/app/backend/scripts/db.sqlite
      - ./data/uploads:/app/data/uploads