<!-- Header -->
<div class="mb-8">
    <span class="text-xs font-semibold text-indigo-600 uppercase tracking-wider">Paso 1 de 5</span>
    <h1 class="text-2xl font-bold text-gray-900 mt-1 mb-1">Datos personales</h1>
    <p class="text-gray-500 text-sm">Por favor, introduce tus datos básicos para comenzar la solicitud.</p>
</div>

<div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
    <div class="p-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="space-y-2">
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider">Nombre <span
                        class="text-red-500">*</span></label>
                <input type="text" [(ngModel)]="nombre" required placeholder="Ej: Juan"
                    class="block w-full px-4 py-3 text-sm border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 rounded-xl transition-all bg-gray-50/50">
            </div>

            <div class="space-y-2">
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider">Apellidos <span
                        class="text-red-500">*</span></label>
                <input type="text" [(ngModel)]="apellidos" required placeholder="Ej: Pérez García"
                    class="block w-full px-4 py-3 text-sm border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 rounded-xl transition-all bg-gray-50/50">
            </div>

            <div class="space-y-2">
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider">Documento de identidad <span
                        class="text-red-500">*</span></label>
                <div class="grid grid-cols-1 sm:grid-cols-[180px_minmax(0,1fr)] gap-3">
                    <select [(ngModel)]="documentType" (ngModelChange)="onDocumentTypeChange()"
                        class="block w-full px-4 py-3 text-sm border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 rounded-xl transition-all bg-gray-50/50">
                        <option *ngFor="let option of documentTypeOptions" [ngValue]="option">{{ getDocumentTypeOptionLabel(option) }}</option>
                    </select>
                    <input type="text" [(ngModel)]="dni" (blur)="onDocumentBlur()" required [placeholder]="documentPlaceholder"
                        [class.border-red-400]="showDocumentError"
                        [class.focus:ring-red-500]="showDocumentError"
                        [class.focus:border-red-500]="showDocumentError"
                        class="block w-full px-4 py-3 text-sm border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 rounded-xl transition-all bg-gray-50/50">
                </div>
                <p class="text-xs text-gray-500">Tipo seleccionado: {{ documentTypeLabel }}.</p>
                <p *ngIf="showDocumentError" class="flex items-center gap-2 text-sm text-red-600">
                    <svg class="h-4 w-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v4m0 4h.01M10.29 3.86l-7.5 13A1 1 0 003.66 18h16.68a1 1 0 00.87-1.49l-7.5-13a1 1 0 00-1.74 0z"></path>
                    </svg>
                    {{ documentErrorMessage }}
                </p>
            </div>

            <div class="space-y-2">
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider">Correo electrónico <span
                        class="text-red-500">*</span></label>
                <input type="email" [(ngModel)]="email" (blur)="onEmailBlur()" required placeholder="Ej: juan.perez@email.com"
                    [class.border-red-400]="showEmailError"
                    [class.focus:ring-red-500]="showEmailError"
                    [class.focus:border-red-500]="showEmailError"
                    class="block w-full px-4 py-3 text-sm border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 rounded-xl transition-all bg-gray-50/50">
                <p *ngIf="showEmailError" class="flex items-center gap-2 text-sm text-red-600">
                    <svg class="h-4 w-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v4m0 4h.01M10.29 3.86l-7.5 13A1 1 0 003.66 18h16.68a1 1 0 00.87-1.49l-7.5-13a1 1 0 00-1.74 0z"></path>
                    </svg>
                    El formato del correo electrónico no es correcto.
                </p>
            </div>

        </div>
    </div>
</div>

<!-- Navigation buttons -->
<div class="mt-10 flex justify-end">
    <button (click)="onNext()" [disabled]="!canContinue"
        class="flex items-center gap-2 px-10 py-3.5 rounded-xl bg-indigo-600 text-sm font-bold text-white hover:bg-indigo-700 shadow-lg shadow-indigo-200 transition-all active:scale-[0.98]">
        Siguiente
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
        </svg>
    </button>
</div>
