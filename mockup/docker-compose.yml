services:
  mockup:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - NG_CLI_ANALYTICS=ci
    command: npm start -- --host 0.0.0.0 --port 4200 --serve-path /somo-convalidaciones
    networks:
      - proxy_net

networks:
  proxy_net:
    external: true
    name: nginx_proxy_net
